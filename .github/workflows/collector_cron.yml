name: "24/7 Vast.ai GPU Data Collector"
run-name: "Collect GPU Market Snapshot"

on:
  schedule:
    # Run every 10 minutes automatically 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent concurrent runs from conflicting
concurrency:
  group: collector-cron
  cancel-in-progress: false

jobs:
  collect-data:
    name: "Collect GPU Market Snapshot"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect GPU Market Snapshot from Vast.ai API
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          python collector.py --once

      - name: Commit and push updated GPU dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gpu_history.db
          if git diff --staged --quiet; then
            echo "No changes in database to commit."
          else
            git commit -m "chore(data): auto-update GPU market dataset [skip ci]"
            git push origin main
          fi

